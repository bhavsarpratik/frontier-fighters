<!doctype html>
<html><head><meta charset="utf-8"><title>Online pair test</title>
<style>body{margin:0;background:#111;display:flex;flex-direction:column}iframe{width:960px;height:540px;border:0;display:block}</style></head>
<body>
<script>
  const q = new URLSearchParams(location.search);
  const code = q.get('code') || 'PAIR' + Math.floor(Math.random() * 1e6);
  const extra = (q.has('manual') ? '' : '&auto') + (q.get('strategy') ? '&strategy=' + q.get('strategy') : '');
  const via = q.get('via') === 'p2p' ? 'p2p' : 'bc';
  for (const [role, pick] of [['host', q.get('a') || 0], ['guest', q.get('b') || 5]]) {
    const f = document.createElement('iframe');
    f.src = `/?${via}=${code}&role=${role}&pick=${pick}${extra}`;
    document.body.append(f);
  }
</script>
</body></html>
